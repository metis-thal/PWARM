[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PWARM"
version = "0.1.0a0"
description = "Physical World AI Reasoning Model - a self-evolving virtual physics world"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "PWARM" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "pyyaml>=6.0",
]

[project.scripts]
pwarm = "pwarm.cli:main"

[project.optional-dependencies]
ai = [
    "pysr>=0.16",
    "torch>=2.1",
]
viz = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "moderngl>=5.10",
    "glfw>=2.7",
]
parallel = [
    "ray>=2.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwarm = ["universes/*/config.yaml", "universes/*/rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["pwarm"]

[tool.coverage.report]
# Release gate: branch coverage over the whole pwarm package (ISO/IEC/IEEE
# 29119-aligned policy — see docs/testing/TEST_POLICY.md).
fail_under = 80
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"
